<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HTTCmdTACT</title>
</head>
<body>
    <h1>HTTCmdTACT</h1>
    <ul>
        <li><a href="ContentExtensionTest-01.html">ContentExtensionTest-01.html</a></li>
        <li><a href="ContentExtensionTest-02.html">ContentExtensionTest-02.html</a></li>
    </ul>
    <pre id="response" role="status">Loading...</pre>
    <script>
        async function echo() {
            const output = document.getElementById('response');
            try {
                const response = await fetch('/API-Echo', { method: 'POST' });
                const text = await response.text();
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                output.textContent = text;
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            }
        }
        echo();
    </script>
</body>
</html>
